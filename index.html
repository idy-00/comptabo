<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comptabo - Paiement Sécurisé</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .payment-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 35px 30px;
            text-align: center;
        }

        .logo {
            font-size: 36px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .logo span {
            color: #667eea;
        }

        .subtitle {
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .payment-methods {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .payment-method {
            background: rgba(255,255,255,0.1);
            padding: 10px 16px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            font-size: 13px;
            font-weight: 500;
        }

        .payment-method img {
            height: 20px;
        }

        .payment-method.wave {
            background: #1DC9F6;
        }

        .payment-method.om {
            background: #F7941D;
        }

        .payment-method.card {
            background: #1A1F71;
        }

        .form-section {
            padding: 35px 30px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 16px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        .form-group textarea {
            resize: none;
            height: 80px;
        }

        .amount-input-wrapper {
            position: relative;
        }

        .amount-input-wrapper input {
            padding-right: 70px;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
        }

        .currency-badge {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: #f0f0f0;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            color: #666;
            font-size: 14px;
        }

        .btn-pay {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-pay:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .btn-pay:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-pay svg {
            width: 22px;
            height: 22px;
        }

        .secure-info {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .secure-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #28a745;
            font-size: 13px;
            font-weight: 500;
        }

        .secure-badge svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .info-text {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 12px;
            line-height: 1.5;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #fee;
            color: #c00;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 480px) {
            .header {
                padding: 30px 20px;
            }
            .form-section {
                padding: 30px 20px;
            }
            .logo {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="payment-card">
            <div class="header">
                <div class="logo">Compta<span>bo</span></div>
                <div class="subtitle">Paiement sécurisé</div>
                <div class="payment-methods">
                    <div class="payment-method wave">
                        <span>Wave</span>
                    </div>
                    <div class="payment-method om">
                        <span>Orange Money</span>
                    </div>
                    <div class="payment-method card">
                        <span>Visa / MC</span>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="error-message" id="errorMsg"></div>

                <form id="paymentForm">
                    <div class="form-group">
                        <label>Montant</label>
                        <div class="amount-input-wrapper">
                            <input type="number" id="amount" placeholder="0" min="100" required>
                            <span class="currency-badge">FCFA</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Description (optionnel)</label>
                        <textarea id="description" placeholder="Ex: Achat produit, Abonnement..."></textarea>
                    </div>

                    <button type="submit" class="btn-pay" id="btnPay">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                            <line x1="1" y1="10" x2="23" y2="10"></line>
                        </svg>
                        Payer maintenant
                    </button>
                </form>

                <div class="secure-info">
                    <div class="secure-badge">
                        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
                        Paiement 100% sécurisé
                    </div>
                    <p class="info-text">
                        Vous serez redirigé vers PayTech pour choisir<br>
                        votre mode de paiement (Wave, OM, Carte)
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('paymentForm');
        const btn = document.getElementById('btnPay');
        const errorMsg = document.getElementById('errorMsg');

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add('show');
            setTimeout(() => errorMsg.classList.remove('show'), 5000);
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const amount = document.getElementById('amount').value;
            const description = document.getElementById('description').value || 'Paiement Comptabo';

            if (!amount || amount < 100) {
                showError('Le montant minimum est de 100 FCFA');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div> Redirection...';

            try {
                const response = await fetch('api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        amount: parseInt(amount),
                        description: description
                    })
                });

                const data = await response.json();

                if (data.success && data.redirect_url) {
                    window.location.href = data.redirect_url;
                } else {
                    showError(data.message || 'Erreur lors de la création du paiement');
                    btn.disabled = false;
                    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                        <line x1="1" y1="10" x2="23" y2="10"></line>
                    </svg> Payer maintenant`;
                }
            } catch (error) {
                showError('Erreur de connexion. Réessayez.');
                btn.disabled = false;
                btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                    <line x1="1" y1="10" x2="23" y2="10"></line>
                </svg> Payer maintenant`;
            }
        });
    </script>
</body>
</html>
